name: Automated HydroPINN Data Engine

on:
  schedule:
    # Server GitHub otomatis berjalan setiap jam 02.00 Pagi WIB (19:00 UTC)
    - cron: '0 19 * * *'
  workflow_dispatch: # Tombol manual agar kamu bisa ngetes robotnya kapan saja

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Ambil Kode dari Repositori
      uses: actions/checkout@v4

    - name: 2. Pasang Python di Cloud
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Install Pustaka Geospasial
      run: |
        python -m pip install --upgrade pip
        pip install xarray numpy pandas netcdf4

    - name: 4. Jalankan Pemrosesan Data Otomatis
      run: python engine.py

    - name: 5. Simpan Hasil data_laut.nc ke GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add data_laut.nc
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Update: data_laut.nc [$(date)]" && git push)
